# Minimal PRIMARY/NODE stack for scripts/e2e-docker-endpoints.sh. One project per
# installation (api + worker + control with the accept-all fallback backend), on
# a shared external network so the NODE reaches the PRIMARY by hostname.
name: pcep

services:
  api:
    build:
      context: ..
      dockerfile: infra/compose/Dockerfile.api
    image: pcep-e2e-api:local
    environment:
      PROXYCORE_API_ADDR: ":3000"
      PROXYCORE_ENROLLMENT_TLS_ADDR: ":3443"
      PROXYCORE_UI_DIST: /app/ui
      PROXYCORE_SQLITE_PATH: /var/lib/proxycore-db/proxycore.db
      PROXYCORE_MASTER_KEY_BASE64: ${PCEP_MASTER_KEY:?}
      PROXYCORE_SECURE_COOKIES: "0"
      PROXYCORE_UPDATE_CHECK_ENABLED: "0"
      PROXYCORE_NODE_SYNC_INTERVAL: 5s
    volumes:
      - sqlite-data:/var/lib/proxycore-db
    ports:
      - "127.0.0.1:${PCEP_WEB_PORT:?}:3000"
      - "127.0.0.1:${PCEP_TLS_PORT:?}:3443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      default:
      pcep-net:
        aliases: ["${PCEP_ALIAS:?}"]

  worker:
    build:
      context: ..
      dockerfile: infra/compose/Dockerfile.runtime
    image: pcep-e2e-runtime:local
    command: ["/usr/local/bin/proxycore-worker"]
    environment:
      PROXYCORE_SQLITE_PATH: /var/lib/proxycore-db/proxycore.db
      PROXYCORE_MASTER_KEY_BASE64: ${PCEP_MASTER_KEY:?}
      WORKER_SOCKET_PATH: /run/proxycore/control.sock
      WORKER_CANDIDATE_ROOT: /var/lib/proxycore/candidates
      WORKER_RECONCILIATION_INTERVAL_MS: "300000"
      WORKER_JOB_LEASE_MS: "120000"
      WORKER_HEARTBEAT_PATH: /run/proxycore/worker.heartbeat
      NGINX_ACME_UPSTREAM: http://127.0.0.1:3000
    volumes:
      - candidates:/var/lib/proxycore
      - control-socket:/run/proxycore
      - sqlite-data:/var/lib/proxycore-db
    depends_on:
      api:
        condition: service_healthy
      control:
        condition: service_started

  control:
    image: pcep-e2e-runtime:local
    command: ["/usr/local/bin/proxycore-control"]
    environment:
      WORKER_SOCKET_PATH: /run/proxycore/control.sock
      CANDIDATE_ROOT: /var/lib/proxycore/candidates
    volumes:
      - candidates:/var/lib/proxycore
      - control-socket:/run/proxycore

volumes:
  sqlite-data:
  candidates:
  control-socket:

networks:
  pcep-net:
    external: true
    name: pcep-net

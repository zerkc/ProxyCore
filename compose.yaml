name: proxycore

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proxycore}
      POSTGRES_USER: ${POSTGRES_USER:-proxycore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [control]

  # Go control plane: SPA + auth + all configuration routes + ACME challenge.
  api:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.api
    environment:
      PROXYCORE_API_ADDR: ":3000"
      PROXYCORE_UI_DIST: /app/ui
      DATABASE_URL: postgres://${POSTGRES_USER:-proxycore}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-proxycore}
      PROXYCORE_MASTER_KEY_BASE64: ${PROXYCORE_MASTER_KEY_BASE64:?set a 32-byte base64 master key}
      PROXY_INGRESS_IPV4: ${PROXY_INGRESS_IPV4:-}
      PROXY_INGRESS_IPV6: ${PROXY_INGRESS_IPV6:-}
      ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-https://acme-staging-v02.api.letsencrypt.org/directory}
      ACME_PRODUCTION_DIRECTORY_URL: ${ACME_PRODUCTION_DIRECTORY_URL:-https://acme-v02.api.letsencrypt.org/directory}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [control, data]

  # Drizzle migrator (Node one-shot). Not started with `up`; used by install.sh.
  migrate:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-proxycore}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-proxycore}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control]
    profiles: [tools]

  worker:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-proxycore}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-proxycore}
      PROXYCORE_MASTER_KEY_BASE64: ${PROXYCORE_MASTER_KEY_BASE64:?set a 32-byte base64 master key}
      WORKER_SOCKET_PATH: /run/proxycore/control.sock
      WORKER_CANDIDATE_ROOT: /var/lib/proxycore/candidates
      WORKER_RECONCILIATION_INTERVAL_MS: ${WORKER_RECONCILIATION_INTERVAL_MS:-300000}
      WORKER_JOB_LEASE_MS: ${WORKER_JOB_LEASE_MS:-120000}
      WORKER_HEARTBEAT_PATH: /run/proxycore/worker.heartbeat
      NGINX_ACME_UPSTREAM: ${NGINX_ACME_UPSTREAM:-http://127.0.0.1:3000}
      NGINX_NETWORK_MODE: host
    volumes:
      - candidates:/var/lib/proxycore
      - control-socket:/run/proxycore
    depends_on:
      postgres:
        condition: service_healthy
      control:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /run/proxycore/worker.heartbeat && test $$(($(date +%s)-$$(stat -c %Y /run/proxycore/worker.heartbeat))) -lt 180",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [control]

  control:
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.control
    environment:
      NODE_ENV: production
      WORKER_SOCKET_PATH: /run/proxycore/control.sock
      CONTROL_BACKEND: docker
      CANDIDATE_ROOT: /var/lib/proxycore/candidates
      COREDNS_ZONES_ROOT: /var/lib/proxycore/coredns-zones
      COREDNS_CONFIG_ROOT: /var/lib/proxycore/coredns-config
      NGINX_CONTAINER_NAME: proxycore-nginx
      COREDNS_CONTAINER_NAME: proxycore-coredns
    volumes:
      - candidates:/var/lib/proxycore
      - coredns-zones:/var/lib/proxycore/coredns-zones
      - coredns-config:/var/lib/proxycore/coredns-config
      - control-socket:/run/proxycore
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/proxycore/control.sock"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [control]

  coredns:
    container_name: proxycore-coredns
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.coredns
    image: proxycore-coredns:local
    # Corefile lives on coredns-config volume so recreate keeps applied zones.
    command: ["-conf", "/etc/coredns-config/Corefile"]
    volumes:
      - candidates:/var/lib/proxycore:ro
      - coredns-zones:/etc/coredns/zones
      - coredns-config:/etc/coredns-config
    ports:
      - "${DNS_PORT:-53}:53/tcp"
      - "${DNS_PORT:-53}:53/udp"
    networks: [data]

  nginx:
    container_name: proxycore-nginx
    build:
      context: .
      dockerfile: infra/compose/Dockerfile.nginx
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.30.4-alpine-slim}
    image: proxycore-nginx:local
    # Host networking so HTTP/HTTPS and dynamic stream ports bind on the host
    # without republishing Compose ports after each stream change.
    network_mode: host
    volumes:
      - certificates:/etc/nginx/certs:ro
      - candidates:/var/lib/proxycore:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Fixed-IP origin for local proxy tests. Point a proxied record at 172.30.0.10:80.
  demo-upstream:
    image: traefik/whoami:v1.11.0
    networks:
      data:
        ipv4_address: 172.30.0.10

volumes:
  postgres-data:
  candidates:
  control-socket:
  certificates:
  coredns-zones:
  coredns-config:

networks:
  control:
  data:
    ipam:
      config:
        - subnet: 172.30.0.0/24

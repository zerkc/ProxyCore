name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without leading v (must match VERSION file)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME#v}"
          fi
          RAW="${RAW#v}"
          if [[ "$RAW" != "$FILE_VERSION" ]]; then
            echo "::error::Tag/version '${RAW}' does not match VERSION file '${FILE_VERSION}'."
            echo "Bump VERSION (and package.json) before tagging."
            exit 1
          fi
          if [[ ! "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semver: ${RAW}"
            exit 1
          fi
          echo "version=${RAW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${RAW}" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, and test (JS)
        run: |
          bun run typecheck
          bun run lint
          bun run test

      - name: Test (Go)
        working-directory: apps/api
        run: go test ./...

      - name: Build UI
        run: bun run build:ui

      - name: Build API binaries
        working-directory: apps/api
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p ../../dist
          for pair in linux/amd64 linux/arm64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            out="../../dist/proxycore-api_${VERSION}_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
              -ldflags="-s -w -X github.com/zerkc/ProxyCore/apps/api/internal/version.Version=${VERSION}" \
              -o "$out" ./cmd/server
          done
          cd ../../dist
          sha256sum proxycore-api_* > SHA256SUMS

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image is published as a multi-arch manifest. Go stages and the UI
      # stage run on the build platform and cross-compile, so QEMU only executes
      # the small alpine `apk add` steps. The bun runtime image has no arm/v7
      # build upstream, so it is amd64 + arm64 only.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.api
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proxycore-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/proxycore-api:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/proxycore-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proxycore-runtime:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/proxycore-runtime:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/proxycore-runtime:latest
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Build and push updater image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.updater
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proxycore-updater:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/proxycore-updater:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/proxycore-updater:latest
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

      - name: Build and push updater-bootstrap image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.updater-bootstrap
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proxycore-updater-bootstrap:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/proxycore-updater-bootstrap:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/proxycore-updater-bootstrap:latest
          cache-from: type=gha,scope=updater-bootstrap
          cache-to: type=gha,mode=max,scope=updater-bootstrap

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.migrate
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proxycore-migrate:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/proxycore-migrate:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/proxycore-migrate:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.nginx
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proxycore-nginx:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/proxycore-nginx:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/proxycore-nginx:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Build and push coredns image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.coredns
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proxycore-coredns:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/proxycore-coredns:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/proxycore-coredns:latest
          cache-from: type=gha,scope=coredns
          cache-to: type=gha,mode=max,scope=coredns

      - name: Ensure release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            git tag "$TAG" "${{ github.sha }}"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ProxyCore ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/proxycore-api_*
            dist/SHA256SUMS
          body: |
            ## ProxyCore ${{ steps.version.outputs.tag }}

            ### Install / update

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh
            ```

            ### Container images

            Multi-arch manifests (linux/amd64, linux/arm64; linux/arm/v7 for every
            image except `proxycore-runtime`, which needs Bun):

            ```
            ghcr.io/${{ github.repository_owner }}/proxycore-{api,runtime,updater,updater-bootstrap,migrate,nginx,coredns}:${{ steps.version.outputs.version }}
            ```

            ### Checksums

            See `SHA256SUMS` attached to this release.

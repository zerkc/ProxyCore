name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without leading v (must match VERSION file)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolves the version and runs the test suites once. Every other job waits
  # on this one so nothing is built or published from a broken tree.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME#v}"
          fi
          RAW="${RAW#v}"
          if [[ "$RAW" != "$FILE_VERSION" ]]; then
            echo "::error::Tag/version '${RAW}' does not match VERSION file '${FILE_VERSION}'."
            echo "Bump VERSION (and package.json) before tagging."
            exit 1
          fi
          if [[ ! "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semver: ${RAW}"
            exit 1
          fi
          echo "version=${RAW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${RAW}" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, and test (JS)
        run: |
          bun run typecheck
          bun run lint
          bun run test

      - name: Test (Go)
        working-directory: apps/api
        run: go test ./...

  binaries:
    name: Binaries
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build UI
        run: bun run build:ui

      - name: Build API binaries
        working-directory: apps/api
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          mkdir -p ../../dist
          for pair in linux/amd64 linux/arm64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            out="../../dist/proxycore-api_${VERSION}_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
              -ldflags="-s -w -X github.com/zerkc/ProxyCore/apps/api/internal/version.Version=${VERSION}" \
              -o "$out" ./cmd/server
          done
          cd ../../dist
          sha256sum proxycore-api_* > SHA256SUMS

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Every image is published as a multi-arch manifest. Go stages and the UI
  # stage run on the build platform and cross-compile, so QEMU only executes
  # the small alpine `apk add` steps. The bun runtime image has no arm/v7
  # build upstream, so it is amd64 + arm64 only.
  images:
    name: Image ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: Dockerfile.api
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - name: runtime
            file: Dockerfile.runtime
            platforms: linux/amd64,linux/arm64
          - name: updater
            file: Dockerfile.updater
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - name: updater-bootstrap
            file: Dockerfile.updater-bootstrap
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - name: migrate
            file: Dockerfile.migrate
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - name: nginx
            file: Dockerfile.nginx
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - name: coredns
            file: Dockerfile.coredns
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - name: worker
            file: Dockerfile.worker
            platforms: linux/amd64,linux/arm64,linux/arm/v7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proxycore-${{ matrix.name }}:${{ needs.verify.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/proxycore-${{ matrix.name }}:${{ needs.verify.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/proxycore-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Only runs when the binaries and every image succeeded.
  release:
    name: Release
    needs: [verify, binaries, images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Ensure release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            git tag "$TAG" "${{ github.sha }}"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ProxyCore ${{ needs.verify.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/proxycore-api_*
            dist/SHA256SUMS
          body: |
            ## ProxyCore ${{ needs.verify.outputs.tag }}

            ### Install / update

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh
            ```

            ### Container images

            Multi-arch manifests (linux/amd64, linux/arm64; linux/arm/v7 for every
            image except `proxycore-runtime`, which needs Bun):

            ```
            ghcr.io/${{ github.repository_owner }}/proxycore-{api,runtime,updater,updater-bootstrap,migrate,nginx,coredns,worker}:${{ needs.verify.outputs.version }}
            ```

            ### Checksums

            See `SHA256SUMS` attached to this release.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-js:
    name: Test (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  test-go:
    name: Test (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proxycore
          POSTGRES_PASSWORD: proxycore
          POSTGRES_DB: proxycore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proxycore -d proxycore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://proxycore:proxycore@localhost:5432/proxycore?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Test
        working-directory: apps/api
        run: go test ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build UI
        run: bun run build:ui

      - name: Build API
        working-directory: apps/api
        run: |
          VERSION="$(tr -d '[:space:]' < ../../VERSION)"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X github.com/zerkc/ProxyCore/apps/api/internal/version.Version=${VERSION}" \
            -o /tmp/proxycore-api ./cmd/server

      - name: Validate Compose file
        run: docker compose -f compose.yaml config --quiet

  ci:
    name: CI
    if: always()
    needs: [test-js, test-go, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require green jobs
        run: |
          js='${{ needs.test-js.result }}'
          go='${{ needs.test-go.result }}'
          build='${{ needs.build.result }}'
          echo "test-js=${js} test-go=${go} build=${build}"
          test "$js" = success && test "$go" = success && test "$build" = success
